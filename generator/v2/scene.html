<script>
const TOPIC = window.__TOPIC, M = window.__MARKS, DUR = window.__DUR, ENV = window.__ENV || [], TH = window.__THEME, OUTRO = window.__OUTRO;
const SC = TOPIC.scenes, N = SC.length, CLIPS = window.__CLIPS || {}, FMT = TOPIC.format || 'tips';                       // marks has N + 1 entries (last = outro)
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const words = s => esc(s).split(' ').map(w => `<span class="w">${w} </span>`).join('');
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const lum = c => (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255;
const inr = n => Math.round(n).toLocaleString('en-IN');

// ---------- theme ----------
const light = lum(TH.bg_top) > 0.6, R = document.documentElement.style;
const set = (k, v) => R.setProperty(k, v);
set('--bgt', rgb(TH.bg_top)); set('--bgb', rgb(TH.bg_bot)); set('--h1', rgb(TH.head1)); set('--h2', rgb(TH.head2));
set('--acc', rgb(TH.accent)); set('--acct', rgb(TH.accent_text)); set('--capbg', rgb(TH.cap_bg, .9));
set('--capfg', lum(TH.cap_fg) > 0.9 ? '#FFC454' : rgb(TH.cap_fg)); set('--capdim', 'rgba(255,240,215,.42)');
set('--chipbg', light ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.09)'); set('--chipline', rgb(TH.head1, .22));
set('--notebg', light ? '#fff' : rgb(TH.cap_bg, .92));
set('--shadow', light ? 'rgba(60,30,10,.16)' : 'rgba(0,0,0,.28)');
$('#b1').style.background = `radial-gradient(circle,${rgb(TH.accent, light ? .20 : .42)} 0%,${rgb(TH.accent, 0)} 62%)`;
$('#b2').style.background = `radial-gradient(circle,${rgb(TH.head2, light ? .14 : .20)} 0%,${rgb(TH.head2, 0)} 62%)`;
$('#b3').style.background = `radial-gradient(circle,${rgb(TH.accent, light ? .16 : .40)} 0%,${rgb(TH.accent, 0)} 62%)`;
$('#grid').style.backgroundImage = `radial-gradient(${rgb(TH.head1, light ? .09 : .10)} 2.2px,transparent 2.6px)`;

// ---------- build scenes ----------
const fit = (el, maxW) => { let f = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > maxW && f > 24) { f -= 2; el.style.fontSize = f + 'px'; } };
const numParts = s => { const m = /^(-?)(₹?)(\d[\d,]*)(%?)$/.exec(String(s).trim()); if (!m) return null; const v = +m[3].replace(/,/g, ''); return v >= 100 ? { pre: m[1] + m[2], v, suf: m[4] } : null; };
const head = (h, cls = '') => `<div class="abs head ${cls}"><div class="l1">${words(h[0] || '')}</div><div class="l2"><span class="fit">${words(h[1] || '')}</span></div></div>`;
const els = SC.map((sc, i) => {
  const d = document.createElement('div'); d.className = 'abs scene'; let h = '';
  if (sc.kind === 'hook') {
    const b = sc.big || [];
    h = `<div class="abs hk"><div class="hk1 fit">${esc(b[0])}</div><div class="hk2 fit">${numParts(b[1]) ? esc(b[1]) : words(b[1])}</div><div class="hk3 fit">${words(b[2] || '')}</div></div>`;
  } else if (sc.kind === 'list') {
    const n = sc.items.length, ch = n <= 2 ? 160 : n <= 3 ? 132 : 104, gap = n <= 3 ? 18 : 14, bs = ch - 40;
    h = head(sc.head) + sc.items.map((it, j) => `<div class="card" style="top:${470 + j * (ch + gap)}px;height:${ch}px">
      <div class="badge" style="width:${bs}px;height:${bs}px;font-size:${bs * .5}px">${esc(it[0])}</div>
      <div class="tx"><div class="ti fit">${esc(it[1])}</div>${it[2] ? `<div class="su fit">${esc(it[2])}</div>` : ''}</div></div>`).join('');

window.seek = (t) => {
  tl.seek(t, false);
  const o = (id, x, y) => $(id).style.transform = `translate(${x}px,${y}px)`;
  o('#b1', -350 + 160 * Math.sin(t * .5), -250 + 120 * Math.cos(t * .4));
  o('#b2', 380 + 140 * Math.cos(t * .45), 500 + 180 * Math.sin(t * .35));
  o('#b3', -100 + 200 * Math.sin(t * .3 + 2), 1100 + 100 * Math.cos(t * .5));
  $('#grid').style.backgroundPosition = `0px ${-t * 14}px`;
  $('#bar').style.transform = `scaleX(${Math.min(1, t / DUR)})`;
  capEls.forEach((el, i) => { const p = (t - M[i].start) / (M[i].end - M[i].start);
    $$('span', el).forEach(s => { s.className = p >= +s.dataset.b ? 'on' : (p >= +s.dataset.a ? 'now' : ''); }); });
  drawChar(t);
  // demo scenes: swap in the screen-recording frame for this moment
  return Promise.all(DEMOS.filter(d => d.clip).map(d => {
    const k = Math.max(0, Math.min(d.clip[1] - 1, Math.floor((t - d.a) * 30)));
    const src = 'file://' + d.clip[0] + '/' + String(k + 1).padStart(4, '0') + '.jpg';
    if (d.img.dataset.src === src) return 0;
    d.img.dataset.src = src; d.img.src = src; return d.img.decode().catch(() => 0);
  }));
};
window.ready = document.fonts.load('800 40px PJS').then(() => Promise.all(['500', '600', '700', '800'].flatMap(w => [document.fonts.load(w + ' 40px PJS'), document.fonts.load(w + ' 40px PJSx', '₹')])))
  .then(() => Promise.all([...document.images].map(i => i.decode().catch(() => 0)))).then(async () => { build(); await seek(0); return true; });
</script></body></html>
